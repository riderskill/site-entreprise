<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RIDERSKILL - Achat & Revente Matériel</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --border-color: #30363d;
            --accent-color: #00e699;
            --accent-hover: #00b377;
            --text-color: #c9d1d9;
            --text-bright: #ffffff;
            --danger-color: #f85149;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding-bottom: 50px;
        }

        header {
            background-color: #090d12;
            border-bottom: 1px solid var(--border-color);
            padding: 15px 20px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-title {
            color: var(--accent-color);
            font-size: 1.4rem;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        nav {
            margin-top: 10px;
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        nav a {
            color: var(--text-color);
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            transition: color 0.2s;
        }

        nav a:hover, nav a.active {
            color: var(--accent-color);
        }

        .container {
            max-width: 1400px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .page-intro {
            text-align: center;
            margin-bottom: 30px;
        }

        .page-intro h1 {
            color: var(--text-bright);
            font-size: 1.8rem;
            margin-bottom: 5px;
        }

        .page-intro p {
            color: #8b949e;
            font-size: 0.95rem;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s, border-color 0.2s;
        }

        .card:hover {
            border-color: var(--accent-color);
        }

        .card-img-container {
            width: 100%;
            height: 180px;
            background-color: #21262d;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #8b949e;
            position: relative;
            overflow: hidden;
        }

        .card-img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-body {
            padding: 15px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .card-title {
            color: var(--accent-color);
            font-size: 1.05rem;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .card-desc {
            font-size: 0.85rem;
            color: #8b949e;
            margin-bottom: 15px;
            flex-grow: 1;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 10px;
            border-top: 1px solid var(--border-color);
        }

        .price {
            color: var(--text-bright);
            font-weight: bold;
            font-size: 1.1rem;
        }

        .badge {
            background-color: rgba(0, 230, 153, 0.15);
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
            padding: 2px 8px;
            border-radius: 3px;
            font-size: 0.75rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        .badge-vendu {
            background-color: rgba(248, 81, 73, 0.15);
            color: var(--danger-color);
            border-color: var(--danger-color);
        }

        /* Zone Admin masquée par défaut */
        .admin-box {
            display: none;
            background: #161b22;
            border: 2px solid var(--accent-color);
            padding: 20px;
            border-radius: 6px;
            margin-bottom: 30px;
        }

        .admin-box.unlocked {
            display: block;
        }

        .admin-footer {
            text-align: center;
            margin-top: 50px;
            border-top: 1px solid var(--border-color);
            padding-top: 20px;
        }

        .btn-admin-login {
            background: transparent;
            border: 1px solid var(--border-color);
            color: #8b949e;
            padding: 5px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .btn-admin-login:hover {
            color: var(--accent-color);
            border-color: var(--accent-color);
        }

        .btn-save {
            background-color: var(--accent-color);
            color: #000;
            border: none;
            padding: 8px 16px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
        }

        .form-group {
            margin-bottom: 10px;
        }

        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 8px;
            background: #0d1117;
            border: 1px solid var(--border-color);
            color: #fff;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-title">RIDERSKILL - MICRO-ENTREPRISE</div>
        <nav>
            <a href="index.html">Accueil</a>
            <a href="services.html">Services & Tarifs</a>
            <a href="achat-revente.html" class="active">Achat / Revente</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <div class="container">
        <div class="page-intro">
            <h1>Espace Achat & Revente Matériel</h1>
            <p>Matériel testé, configuré et prêt à l'emploi. 20 emplacements disponibles.</p>
        </div>

        <!-- Panneau d'administration sécurisé -->
        <div class="admin-box" id="adminPanel">
            <h3 style="color: var(--accent-color); margin-bottom: 10px;">🔒 Espace Administration RiderSkill</h3>
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px;">
                <div class="form-group">
                    <label>Emplacement :</label>
                    <select id="admSelect" onchange="loadAdmData()"></select>
                </div>
                <div class="form-group">
                    <label>Titre :</label>
                    <input type="text" id="admTitle">
                </div>
                <div class="form-group">
                    <label>Prix (€) :</label>
                    <input type="text" id="admPrice">
                </div>
                <div class="form-group">
                    <label>Nom de l'image (ex: rtx3070.jpg) :</label>
                    <input type="text" id="admImg">
                </div>
                <div class="form-group">
                    <label>Statut :</label>
                    <select id="admStatus">
                        <option value="DISPONIBLE">DISPONIBLE</option>
                        <option value="RÉSERVÉ">RÉSERVÉ</option>
                        <option value="VENDU">VENDU</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label>Description :</label>
                <textarea id="admDesc" rows="2"></textarea>
            </div>
            <button class="btn-save" onclick="saveAdmData()">Mettre à jour cet article</button>
        </div>

        <!-- Grille Vitrine Publique -->
        <div class="grid" id="articlesGrid"></div>
    </div>

    <div class="admin-footer">
        <button class="btn-admin-login" onclick="loginAdmin()">🔒 Accès Administration</button>
    </div>

    <script>
        // Mot de passe administrateur sécurisé
        const ADMIN_PASS = "Brayankillyan2613..";

        let items = JSON.parse(localStorage.getItem('riderskill_data')) || Array.from({ length: 20 }, (_, i) => ({
            id: i,
            title: `Article ${String(i + 1).padStart(2, '0')}`,
            price: "00,00 €",
            desc: "Description complète du matériel. État général, caractéristiques techniques et garantie.",
            status: "DISPONIBLE",
            img: ""
        }));

        function render() {
            const grid = document.getElementById('articlesGrid');
            grid.innerHTML = '';
            items.forEach((item, i) => {
                const num = String(i + 1).padStart(2, '0');
                const isVendu = item.status === 'VENDU';
                const badgeClass = isVendu ? 'badge badge-vendu' : 'badge';
                const img = item.img ? `<img src="${item.img}" alt="${item.title}">` : `Photo Article ${num}`;
                
                grid.innerHTML += `
                    <div class="card">
                        <div class="card-img-container">${img}</div>
                        <div class="card-body">
                            <div class="card-title">${item.title}</div>
                            <div class="card-desc">${item.desc}</div>
                            <div class="card-footer">
                                <div class="price">${item.price}</div>
                                <div class="${badgeClass}">${item.status}</div>
                            </div>
                        </div>
                    </div>
                `;
            });

            const sel = document.getElementById('admSelect');
            if(sel) {
                sel.innerHTML = items.map((item, i) => `<option value="${i}">Article ${String(i + 1).padStart(2, '0')} (${item.title})</option>`).join('');
            }
        }

        function loginAdmin() {
            const pwd = prompt("Entrez le mot de passe administrateur :");
            if(pwd === ADMIN_PASS) {
                document.getElementById('adminPanel').classList.add('unlocked');
                loadAdmData();
                alert("Accès autorisé !");
            } else if(pwd !== null) {
                alert("Mot de passe incorrect !");
            }
        }

        function loadAdmData() {
            const idx = document.getElementById('admSelect').value;
            const item = items[idx];
            document.getElementById('admTitle').value = item.title;
            document.getElementById('admPrice').value = item.price;
            document.getElementById('admImg').value = item.img;
            document.getElementById('admStatus').value = item.status;
            document.getElementById('admDesc').value = item.desc;
        }

        function saveAdmData() {
            const idx = document.getElementById('admSelect').value;
            items[idx] = {
                id: parseInt(idx),
                title: document.getElementById('admTitle').value,
                price: document.getElementById('admPrice').value,
                img: document.getElementById('admImg').value,
                status: document.getElementById('admStatus').value,
                desc: document.getElementById('admDesc').value
            };
            localStorage.setItem('riderskill_data', JSON.stringify(items));
            render();
            alert("Article mis à jour !");
        }

        render();
    </script>
</body>
</html>
