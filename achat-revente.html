<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RIDERSKILL - Achat & Revente Matériel</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --border-color: #30363d;
            --accent-color: #00e699;
            --accent-hover: #00b377;
            --text-color: #c9d1d9;
            --text-bright: #ffffff;
            --danger-color: #f85149;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding-bottom: 50px;
        }

        header {
            background-color: #090d12;
            border-bottom: 1px solid var(--border-color);
            padding: 15px 20px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-title {
            color: var(--accent-color);
            font-size: 1.4rem;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        nav {
            margin-top: 10px;
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        nav a {
            color: var(--text-color);
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            transition: color 0.2s;
        }

        nav a:hover, nav a.active {
            color: var(--accent-color);
        }

        .container {
            max-width: 1400px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .page-intro {
            text-align: center;
            margin-bottom: 30px;
        }

        .page-intro h1 {
            color: var(--text-bright);
            font-size: 1.8rem;
            margin-bottom: 5px;
        }

        .page-intro p {
            color: #8b949e;
            font-size: 0.95rem;
        }

        .admin-toggle-bar {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 20px;
        }

        .btn {
            background-color: var(--accent-color);
            color: #000;
            border: none;
            padding: 8px 16px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s;
            font-size: 0.9rem;
        }

        .btn:hover {
            background-color: var(--accent-hover);
        }

        .btn-outline {
            background-color: transparent;
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
        }

        .btn-outline:hover {
            background-color: rgba(0, 230, 153, 0.1);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s, border-color 0.2s;
        }

        .card:hover {
            border-color: var(--accent-color);
        }

        .card-img-container {
            width: 100%;
            height: 180px;
            background-color: #21262d;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #8b949e;
            position: relative;
            overflow: hidden;
        }

        .card-img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-body {
            padding: 15px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .card-title {
            color: var(--accent-color);
            font-size: 1.1rem;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .card-desc {
            font-size: 0.85rem;
            color: #8b949e;
            margin-bottom: 15px;
            flex-grow: 1;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 10px;
            border-top: 1px solid var(--border-color);
        }

        .price {
            color: var(--text-bright);
            font-weight: bold;
            font-size: 1.1rem;
        }

        .badge {
            background-color: rgba(0, 230, 153, 0.15);
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
            padding: 2px 8px;
            border-radius: 3px;
            font-size: 0.75rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        .badge-vendu {
            background-color: rgba(248, 81, 73, 0.15);
            color: var(--danger-color);
            border-color: var(--danger-color);
        }

        /* Panneau Édition */
        .edit-panel {
            display: none;
            background: #161b22;
            border: 1px solid var(--accent-color);
            padding: 20px;
            border-radius: 6px;
            margin-bottom: 25px;
        }

        .edit-panel.active {
            display: block;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            margin-bottom: 4px;
            color: var(--text-bright);
        }

        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 8px;
            background: #0d1117;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            border-radius: 4px;
        }

        .edit-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-title">RIDERSKILL - MICRO-ENTREPRISE</div>
        <nav>
            <a href="#">Accueil</a>
            <a href="#">Services & Tarifs</a>
            <a href="#" class="active">Achat / Revente</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <div class="container">
        <div class="page-intro">
            <h1>Espace Achat & Revente Matériel</h1>
            <p>Matériel testé, configuré et prêt à l'emploi. 20 emplacements disponibles.</p>
        </div>

        <div class="admin-toggle-bar">
            <button class="btn btn-outline" id="toggleEditBtn" onclick="toggleEditMode()">🛠️ Mode Édition / Modifier les articles</button>
        </div>

        <!-- Zone de modification rapide (s'affiche uniquement en cliquant sur le bouton Édition) -->
        <div class="edit-panel" id="editPanel">
            <h3 style="color: var(--accent-color); margin-bottom: 15px;">Modifier un emplacement d'article</h3>
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px;">
                <div class="form-group">
                    <label>Sélectionner l'emplacement :</label>
                    <select id="selectArticle" onchange="loadArticleData()">
                        <!-- Rempli en JS -->
                    </select>
                </div>
                <div class="form-group">
                    <label>Titre de l'article :</label>
                    <input type="text" id="editTitle" placeholder="Ex: RTX 3070 8Go OC">
                </div>
                <div class="form-group">
                    <label>Prix (€) :</label>
                    <input type="text" id="editPrice" placeholder="Ex: 280,00 €">
                </div>
                <div class="form-group">
                    <label>Nom ou Lien de la photo :</label>
                    <input type="text" id="editImg" placeholder="Ex: photo1.jpg ou https://...">
                </div>
                <div class="form-group">
                    <label>Statut :</label>
                    <select id="editStatus">
                        <option value="DISPONIBLE">DISPONIBLE</option>
                        <option value="RÉSERVÉ">RÉSERVÉ</option>
                        <option value="VENDU">VENDU</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label>Description :</label>
                <textarea id="editDesc" rows="2" placeholder="Description du matériel..."></textarea>
            </div>
            <div class="edit-actions">
                <button class="btn" onclick="saveArticleData()">Appliquer sur cet emplacement</button>
                <button class="btn btn-outline" onclick="exportHTML()">📥 Exporter la page modifiée (Code HTML)</button>
            </div>
        </div>

        <!-- Grille des 20 emplacements -->
        <div class="grid" id="articlesGrid">
            <!-- Rempli dynamiquement -->
        </div>
    </div>

    <script>
        // Données par défaut pour les 20 emplacements
        let items = JSON.parse(localStorage.getItem('riderskill_articles')) || Array.from({ length: 20 }, (_, i) => {
            const num = String(i + 1).padStart(2, '0');
            return {
                id: i,
                title: `Article ${num}`,
                price: "00,00 €",
                desc: "Description complète du matériel. État général, caractéristiques techniques et garantie.",
                status: "DISPONIBLE",
                img: ""
            };
        });

        function renderGrid() {
            const grid = document.getElementById('articlesGrid');
            grid.innerHTML = '';

            items.forEach((item) => {
                const num = String(item.id + 1).padStart(2, '0');
                const isVendu = item.status === 'VENDU';
                const badgeClass = isVendu ? 'badge badge-vendu' : 'badge';
                
                const imgHTML = item.img 
                    ? `<img src="${item.img}" alt="${item.title}" onerror="this.onerror=null; this.parentElement.innerHTML='Photo Article ${num}';">`
                    : `Photo Article ${num}`;

                grid.innerHTML += `
                    <div class="card">
                        <div class="card-img-container">
                            ${imgHTML}
                        </div>
                        <div class="card-body">
                            <div class="card-title">${item.title}</div>
                            <div class="card-desc">${item.desc}</div>
                            <div class="card-footer">
                                <div class="price">${item.price}</div>
                                <div class="${badgeClass}">${item.status}</div>
                            </div>
                        </div>
                    </div>
                `;
            });

            // Mettre à jour la liste déroulante du panneau d'édition
            const select = document.getElementById('selectArticle');
            if (select) {
                select.innerHTML = items.map((item, i) => `<option value="${i}">Article ${String(i + 1).padStart(2, '0')} - ${item.title}</option>`).join('');
            }
        }

        function toggleEditMode() {
            const panel = document.getElementById('editPanel');
            panel.classList.toggle('active');
            if (panel.classList.contains('active')) {
                loadArticleData();
            }
        }

        function loadArticleData() {
            const idx = document.getElementById('selectArticle').value;
            const item = items[idx];
            document.getElementById('editTitle').value = item.title;
            document.getElementById('editPrice').value = item.price;
            document.getElementById('editImg').value = item.img;
            document.getElementById('editStatus').value = item.status;
            document.getElementById('editDesc').value = item.desc;
        }

        function saveArticleData() {
            const idx = document.getElementById('selectArticle').value;
            items[idx] = {
                id: parseInt(idx),
                title: document.getElementById('editTitle').value || `Article ${String(parseInt(idx) + 1).padStart(2, '0')}`,
                price: document.getElementById('editPrice').value || "00,00 €",
                img: document.getElementById('editImg').value,
                status: document.getElementById('editStatus').value,
                desc: document.getElementById('editDesc').value || "Description du matériel..."
            };
            
            localStorage.setItem('riderskill_articles', JSON.stringify(items));
            renderGrid();
            alert("L'emplacement " + (parseInt(idx) + 1) + " a été mis à jour !");
        }

        function exportHTML() {
            // Sauvegarde l'état actuel directement dans le code source HTML
            let cloneDoc = document.documentElement.cloneNode(true);
            
            // Masque le panneau d'édition pour le rendu final si besoin
            let scriptTag = cloneDoc.querySelector('script');
            
            let htmlContent = "<!DOCTYPE html>\n" + cloneDoc.outerHTML;
            
            let blob = new Blob([htmlContent], { type: 'text/html' });
            let a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'achat-revente.html';
            a.click();
        }

        // Initialisation au chargement
        renderGrid();
    </script>
</body>
</html>
