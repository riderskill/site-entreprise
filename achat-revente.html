
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RIDERSKILL - Achat & Revente Matériel</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --border-color: #30363d;
            --accent-color: #00e699;
            --accent-hover: #00b377;
            --text-color: #c9d1d9;
            --text-bright: #ffffff;
            --danger-color: #f85149;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding-bottom: 50px;
        }
        header {
            background-color: #090d12;
            border-bottom: 1px solid var(--border-color);
            padding: 15px 20px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header-title {
            color: var(--accent-color);
            font-size: 1.4rem;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        nav {
            margin-top: 10px;
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        nav a {
            color: var(--text-color);
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            transition: color 0.2s;
        }
        nav a:hover, nav a.active {
            color: var(--accent-color);
        }
        .container {
            max-width: 1400px;
            margin: 30px auto;
            padding: 0 20px;
        }
        .page-intro {
            text-align: center;
            margin-bottom: 30px;
        }
        .page-intro h1 {
            color: var(--text-bright);
            font-size: 1.8rem;
            margin-bottom: 5px;
        }
        .page-intro p {
            color: #8b949e;
            font-size: 0.95rem;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
        }
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s, border-color 0.2s;
        }
        .card:hover {
            border-color: var(--accent-color);
        }
        .card-img-container {
            width: 100%;
            height: 180px;
            background-color: #21262d;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #8b949e;
            position: relative;
            overflow: hidden;
        }
        .card-img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .card-body {
            padding: 15px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }
        .card-title {
            color: var(--accent-color);
            font-size: 1.05rem;
            margin-bottom: 8px;
            font-weight: 600;
        }
        .card-desc {
            font-size: 0.85rem;
            color: #8b949e;
            margin-bottom: 15px;
            flex-grow: 1;
        }
        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 10px;
            border-top: 1px solid var(--border-color);
        }
        .price {
            color: var(--text-bright);
            font-weight: bold;
            font-size: 1.1rem;
        }
        .badge {
            background-color: rgba(0, 230, 153, 0.15);
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
            padding: 2px 8px;
            border-radius: 3px;
            font-size: 0.75rem;
            font-weight: bold;
            text-transform: uppercase;
        }
        .badge-vendu {
            background-color: rgba(248, 81, 73, 0.15);
            color: var(--danger-color);
            border-color: var(--danger-color);
        }
        footer {
            text-align: center;
            margin-top: 50px;
            border-top: 1px solid var(--border-color);
            padding-top: 20px;
            color: #8b949e;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <header>
        <div class="header-title">RIDERSKILL - ACHAT / REVENTE</div>
        <nav>
            <a href="index.html">Accueil</a>
            <a href="services.html">Services & Tarifs</a>
            <a href="achat-revente.html" class="active">Achat / Revente</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <div class="container">
        <div class="page-intro">
            <h1>Espace Achat & Revente Matériel</h1>
            <p>Matériel testé, configuré et prêt à l'emploi. 20 emplacements disponibles.</p>
        </div>

        <div class="grid" id="articlesGrid"></div>
    </div>

    <footer>
        <p>&copy; RIDERSKILL - Tous droits réservés.</p>
    </footer>

    <script>
        const items = Array.from({ length: 20 }, (_, i) => ({
            id: i,
            title: `Article ${String(i + 1).padStart(2, '0')}`,
            price: "00,00 €",
            desc: "Description complète du matériel. État général, caractéristiques techniques et garantie.",
            status: "DISPONIBLE",
            img: ""
        }));

        function render() {
            const grid = document.getElementById('articlesGrid');
            grid.innerHTML = '';
            items.forEach((item, i) => {
                const num = String(i + 1).padStart(2, '0');
                const isVendu = item.status === 'VENDU';
                const badgeClass = isVendu ? 'badge badge-vendu' : 'badge';
                const img = item.img ? `<img src="${item.img}" alt="${item.title}">` : `Photo Article ${num}`;

                grid.innerHTML += `
                    <div class="card">
                        <div class="card-img-container">${img}</div>
                        <div class="card-body">
                            <div class="card-title">${item.title}</div>
                            <div class="card-desc">${item.desc}</div>
                            <div class="card-footer">
                                <div class="price">${item.price}</div>
                                <div class="${badgeClass}">${item.status}</div>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        render();
    </script>
</body>
</html>
