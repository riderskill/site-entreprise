<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RIDERSKILL PRODUCTION | Créateur WebTV Gaming & Partenariats</title>

<style>

:root {
    --bg:#08090d;
    --card:#11131a;
    --card2:#171a22;
    --purple:#9147ff;
    --green:#10b981;
    --text:#ffffff;
    --muted:#a1a1aa;
    --border:#27272f;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:var(--bg);
    color:var(--text);
    line-height:1.6;
}

a{
    text-decoration:none;
    color:white;
}


header{
    position:fixed;
    top:0;
    width:100%;
    background:rgba(8,9,13,.92);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border);
    z-index:1000;
}


.nav{
    max-width:1200px;
    margin:auto;
    padding:20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}


.logo{
    font-size:26px;
    font-weight:900;
}

.logo span{
    color:var(--purple);
}


.menu{
    display:flex;
    gap:25px;
    align-items:center;
}


.menu a{
    color:var(--muted);
    font-weight:bold;
}


.menu a:hover{
    color:white;
}


.button{
    background:var(--purple);
    padding:12px 22px;
    border-radius:8px;
    font-weight:bold;
}



.hero{

    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;

    padding:120px 20px 60px;

    background:
    linear-gradient(
    rgba(8,9,13,.85),
    rgba(8,9,13,.98)
    ),
    url("https://images.unsplash.com/photo-1593305841991-05c297ba4575")
    center/cover;

}


.hero-content{
    max-width:900px;
}


.badge{

display:inline-block;
padding:8px 18px;
border:1px solid var(--purple);
border-radius:30px;
color:var(--purple);
font-weight:bold;
margin-bottom:25px;

}


h1{

font-size:clamp(40px,6vw,70px);
line-height:1.1;
margin-bottom:25px;

}


h1 span{

color:var(--purple);

}


.hero p{

font-size:20px;
color:var(--muted);
margin-bottom:35px;

}


.buttons{

display:flex;
justify-content:center;
gap:15px;
flex-wrap:wrap;

}


.btn{

padding:15px 30px;
border-radius:10px;
font-weight:bold;

}


.btn-primary{

background:var(--purple);

}


.btn-secondary{

border:1px solid var(--border);
background:var(--card);

}


section{

max-width:1200px;
margin:auto;
padding:80px 20px;

}


.title{

text-align:center;
margin-bottom:50px;

}


.title h2{

font-size:40px;

}


.title p{

color:var(--muted);

}
