<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RIDERSKILL PRODUCTION | Expertise Hardware & Streaming</title>
    <style>
        :root {
            --bg-primary: #0a0b0e;
            --bg-secondary: #13151b;
            --accent: #a855f7;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border: #2d3748;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-primary); color: var(--text-main); line-height: 1.6; }
        a { text-decoration: none; color: inherit; }
        header { position: fixed; top: 0; left: 0; width: 100%; background: rgba(10, 11, 14, 0.9); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); z-index: 1000; }
        .nav-container { max-width: 1200px; margin: 0 auto; padding: 1.2rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 1.25rem; font-weight: 800; color: var(--text-main); }
        .logo span { color: var(--accent); }
        .nav-links { display: flex; gap: 2rem; align-items: center; }
        .nav-links a { font-size: 0.95rem; font-weight: 500; color: var(--text-muted); transition: 0.3s; }
        .nav-links a:hover, .nav-links a.active { color: var(--text-main); }
        .btn-cta-nav { background-color: var(--accent); color: white !important; padding: 0.6rem 1.2rem; border-radius: 6px; font-weight: 600; }
        .hero { position: relative; height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; padding: 0 1rem; background: linear-gradient(rgba(10, 11, 14, 0.75), rgba(10, 11, 14, 0.95)), url('img/fond-gaming.jpg') no-repeat center center/cover; }
        .hero-content { max-width: 800px; z-index: 2; }
        .hero h1 { font-size: 3rem; font-weight: 800; margin-bottom: 1.5rem; text-transform: uppercase; }
        .hero h1 span { color: var(--accent); }
        .hero p { font-size: 1.15rem; color: var(--text-muted); margin-bottom: 2.5rem; }
        .hero-buttons { display: flex; gap: 1rem; justify-content: center; }
        .btn-primary { background-color: var(--accent); color: white; padding: 0.9rem 2rem; border-radius: 8px; font-weight: 700; }
        .btn-secondary { background: transparent; border: 1px solid var(--border); color: var(--text-main); padding: 0.9rem 2rem; border-radius: 8px; font-weight: 600; }
        footer { background-color: var(--bg-secondary); border-top: 1px solid var(--border); padding: 2rem; text-align: center; color: var(--text-muted); font-size: 0.85rem; }
    </style>
</head>
<body>
    <header>
        <div class="nav-container">
            <a href="index.html" class="logo">RIDERSKILL<span>.</span></a>
            <nav class="nav-links">
                <a href="index.html" class="active">Accueil</a>
                <a href="tarifs.html">Tarifs & Prestations</a>
                <a href="mailto:riderskill.pro@outlook.fr" class="btn-cta-nav">Contact</a>
            </nav>
        </div>
    </header>

    <section class="hero">
        <div class="hero-content">
            <h1>Expertise Hardware & <span>Streaming</span></h1>
            <p>Montage PC sur-mesure, optimisation et partenariats techniques à Cosne-Cours-sur-Loire.</p>
            <div class="hero-buttons">
                <a href="tarifs.html" class="btn-primary">Voir nos tarifs</a>
                <a href="mailto:riderskill.pro@outlook.fr" class="btn-secondary">Nous contacter</a>
            </div>
        </div>
    </section>

    <footer>
        <p>SIRET : 504 712 043 00026 | RIDERSKILL PRODUCTION</p>
    </footer>
</body>
</html>
